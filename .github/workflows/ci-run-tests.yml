name: Run DRRA tests

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      branch:
        type: string
        default: "master"

jobs:
  run-tests:
    runs-on: [modelsim, vesyla, bender, sst]
    steps:
      - name: Install gh CLI
        run: |
          curl -sS https://webi.sh/gh | sh
          source ~/.config/envman/PATH.env
          gh --version

      - name: Download DRRA components library
        run: |
          set -e
          source ~/.config/envman/PATH.env
          BRANCH="${{ inputs.branch }}"
          REPO="silagokth/drra-components"
          rm -f library.tar.gz
          if [ -n "$BRANCH" ] && gh api "repos/$REPO/branches/$BRANCH" >/dev/null 2>&1; then
            RUN_ID=$(gh run list --repo "$REPO" --branch "$BRANCH" \
                       --workflow "PR workflow" \
                       --limit 1 --json databaseId -q '.[0].databaseId')
            if [ -n "$RUN_ID" ]; then
              echo "Using drra-components@$BRANCH library artifact from run $RUN_ID"
              gh run download "$RUN_ID" --repo "$REPO" -n library -D .
            else
              echo "Could not find a run for branch $BRANCH on $REPO; using latest release"
            fi
          else
            echo "Branch $BRANCH not found on $REPO; using latest release"
          fi
          if [ ! -f library.tar.gz ]; then
            gh release download --repo "$REPO" --pattern "library.tar.gz"
          fi
          if [ ! -f library.tar.gz ]; then
            echo "Error: library.tar.gz not found"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.DRRA_COMPONENTS_PAT_VESYLA_READ_ONLY }}

      - name: Extract library
        run: |
          rm -rf library
          tar -xzf library.tar.gz
          rm library.tar.gz

      - name: Checkout DRRA tests
        uses: actions/checkout@v4
        with:
          repository: silagokth/drra-tests
          path: tests
          ref: master
          token: ${{ secrets.DRRA_TESTS_PAT_VESYLA_READ_ONLY }}

      - name: Check drra-tests branch
        run: |
          cd "${{ github.workspace }}/tests"
          git fetch --all
          if git show-ref --verify --quiet refs/remotes/origin/${{ inputs.branch }}; then
            git checkout ${{ inputs.branch }}
            echo "Switching to drra-tests@${{ inputs.branch }}"
          else
            echo "Using the drra-tests master branch"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.DRRA_TESTS_PAT_VESYLA_READ_ONLY }}

      - name: Clean artifacts
        run: rm -rf ${{ github.workspace }}/artifacts

      - name: Get built vesyla artifact
        uses: actions/download-artifact@v4
        with:
          name: pkg-artifacts
          path: ${{ github.workspace }}/artifacts

      - name: Add vesyla to PATH
        run: |
          set -e
          file=(/home/gh-runner/actions-runner/_work/vesyla/vesyla/artifacts/vesyla-*.AppImage)
          if [ "${#file[@]}" -ne 1 ]; then
            echo "Error: Expected exactly one vesyla-*.AppImage file, found ${#file[@]}"
            exit 1
          fi
          cp "${file[0]}" vesyla
          chmod a+x vesyla
          mkdir -p $HOME/.local/bin
          mv vesyla $HOME/.local/bin
          echo "$HOME/.local/bin" > $GITHUB_PATH

      - name: Check if vesyla is correctly installed
        run: |
          version=$(vesyla --version | grep '^vesyla ' | awk '{print $2}')
          echo "Vesyla version: $version"
          echo "Artifact version: ${{ inputs.version }}"
          if [ "$version" = "${{ inputs.version }}" ]; then
            echo "Versions match"
          else
            echo "Versions do not match"
            exit 1
          fi

      - name: Run DRRA tests
        id: run_tests
        continue-on-error: true
        run: |
          cd tests
          . /usr/share/modules/init/sh
          module use /opt/modules
          module add questasim
          module add bender
          module add sst
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          export VESYLA_SUITE_PATH_COMPONENTS=$(readlink -e ../library)
          vesyla --version
          vesyla testcase generate -d ./testcases
          ./run.sh

      - name: Collect failed-test debug logs
        if: steps.run_tests.outcome == 'failure'
        run: |
          cd tests
          . /usr/share/modules/init/sh
          module use /opt/modules
          module add questasim
          module add bender
          module add sst
          source .venv/bin/activate
          export VESYLA_SUITE_PATH_COMPONENTS=$(readlink -e ../library)
          mkdir -p failed_logs
          python3 - <<'PY'
          import os, re, subprocess, pathlib
          from xml.etree import ElementTree as ET

          # Map test name -> testcase path from autotest_config.robot
          name2path = {}
          row = re.compile(r'^([\w:.\-]+)\s{2,}(/\S.*)$')
          in_cases = False
          for line in open('autotest_config.robot'):
              if line.startswith('*** Test Cases'):
                  in_cases = True
                  continue
              if line.startswith('***'):
                  in_cases = False
              if in_cases:
                  m = row.match(line.rstrip())
                  if m:
                      name2path[m.group(1)] = m.group(2)

          # Collect FAIL test names from robot output.xml
          tree = ET.parse('output/output.xml')
          failed = []
          for test in tree.iter('test'):
              st = test.find('status')
              if st is not None and st.get('status') == 'FAIL':
                  failed.append(test.get('name'))
          print(f'Found {len(failed)} failed test(s): {failed}')

          summary = open('failed_logs/SUMMARY.txt', 'w')
          for name in failed:
              path = name2path.get(name)
              slug = re.sub(r'[^A-Za-z0-9_-]', '_', name)
              out = pathlib.Path('failed_logs') / slug
              out.mkdir(parents=True, exist_ok=True)
              log_path = out / 'debug.log'
              summary.write(f'{name}\t{path}\t{log_path}\n')
              if not path:
                  log_path.write_text(f'No testcase path found for {name}\n')
                  continue
              with open(log_path, 'w') as log:
                  log.write(f'===== Test: {name} =====\n')
                  log.write(f'===== Path: {path} =====\n\n')
                  log.write('===== vesyla testcase run -d <path> -o <out>/run =====\n')
                  log.flush()
                  run_dir = out / 'run'
                  subprocess.run(
                      ['vesyla', 'testcase', 'run', '-d', path, '-o', str(run_dir)],
                      stdout=log, stderr=subprocess.STDOUT,
                  )
                  script = run_dir / 'run.sh'
                  if script.exists():
                      log.write('\n===== bash run.sh -d (debug) =====\n')
                      log.flush()
                      subprocess.run(
                          ['bash', 'run.sh', '-d'],
                          cwd=str(run_dir),
                          stdout=log, stderr=subprocess.STDOUT,
                      )
                  else:
                      log.write(f'\nNo run.sh generated at {script}\n')
          summary.close()
          PY
          tar czf ../failed-test-logs.tar.gz failed_logs

      - name: Upload failed-test debug logs
        if: steps.run_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: failed-test-logs
          path: failed-test-logs.tar.gz
          if-no-files-found: ignore

      - name: Compress test outputs
        if: always()
        run: tar czf output.tar.gz tests/output

      - name: Upload test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-outputs
          path: output.tar.gz

      - name: Fail job if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: |
          echo "DRRA tests failed; see failed-test-logs artifact for per-test debug output."
          exit 1
