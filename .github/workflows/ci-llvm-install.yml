name: Install LLVM with MLIR

on:
  workflow_call:
  workflow_dispatch:

env:
  # Upstream llvm/llvm-project release to use. The prebuilt
  # LLVM-<version>-Linux-X64.tar.xz asset ships clang, MLIR and the cmake
  # config packages, so no source build is required.
  LLVM_VERSION: "22.1.8"
  LLVM_INSTALL_PATH: ${{ github.workspace }}/llvm-install

jobs:
  llvm-install:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: true
        path: vesyla

    - name: Restore LLVM Cache if available
      id: cache-llvm
      uses: actions/cache@v4
      env:
        cache-name: cache-llvm
      with:
        path: |
          ${{ env.LLVM_INSTALL_PATH }}
        key: ${{ runner.os }}-llvm-${{ env.LLVM_VERSION }}
        restore-keys: |
          ${{ runner.os }}-llvm-${{ env.LLVM_VERSION }}
          ${{ runner.os }}-llvm-

    - name: Check if LLVM is already installed
      id: check-llvm
      uses: ./vesyla/.github/actions/check-llvm-install
      with:
        llvm-install-path: ${{ env.LLVM_INSTALL_PATH }}

    - name: Download and extract prebuilt LLVM release
      if: steps.check-llvm.outputs.llvm_installed == 'false'
      run: |
        set -euo pipefail
        asset="LLVM-${LLVM_VERSION}-Linux-X64.tar.xz"
        url="https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/${asset}"
        echo "Downloading ${url}"
        mkdir -p "${LLVM_INSTALL_PATH}"
        curl -fL --retry 3 -o "${RUNNER_TEMP}/${asset}" "${url}"
        echo "Extracting ${asset} into ${LLVM_INSTALL_PATH}"
        tar -xf "${RUNNER_TEMP}/${asset}" -C "${LLVM_INSTALL_PATH}" --strip-components=1
        echo "Installed LLVM ${LLVM_VERSION}:"
        ls "${LLVM_INSTALL_PATH}"
        test -d "${LLVM_INSTALL_PATH}/lib/cmake/mlir"
